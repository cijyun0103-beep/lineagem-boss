<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>天堂M 王表系統 - v2.4</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 引入 Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: #e0e0e0; }
        .card { background-color: #1e1e1e; border: 1px solid #333; }
        .table { color: #e0e0e0; }
        .table-dark { background-color: #1a1a1a; }
        .urgent { color: #ff4d4d !important; font-weight: bold; animation: blink 1s infinite; }
        .missed-text { color: #ff4d4d; font-weight: bold; margin-left: 8px; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>⚔️ 天堂M 王表系統</h2>
        <span class="badge bg-secondary">v2.4</span>
    </div>

    <!-- 快速登記 -->
    <div class="card p-3 mb-4 shadow">
        <h5 class="text-warning">⚡ 快速登記小工具</h5>
        <div class="d-flex flex-wrap gap-2 mt-2">
            {% for boss_name in bosses.keys() %}
            <button class="btn btn-primary btn-sm" onclick="quickKill('{{ boss_name }}')">{{ boss_name }}</button>
            {% endfor %}
        </div>
    </div>

    <!-- 手動補登 (支援 Enter 鍵) -->
    <div class="card p-3 mb-4 shadow">
        <h5 class="text-warning">✍️ 手動補登</h5>
        <form onsubmit="event.preventDefault(); manualKill();" class="row g-2 align-items-center mt-1">
            <div class="col-md-5">
                <select id="manualBoss" class="form-select bg-dark text-light border-secondary">
                    {% for boss_name, info in bosses.items() %}
                    <option value="{{ boss_name }}">{{ boss_name }} ({{ info.interval }}分)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-5">
                <input type="text" id="manualTime" class="form-control bg-dark text-light border-secondary" placeholder="4或6碼(例1605)">
            </div>
            <div class="col-md-2">
                <button type="submit" class="btn btn-success w-100">登記</button>
            </div>
        </form>
    </div>

    <!-- 王表現況表 -->
    <div class="card p-3 shadow">
        <h5 class="text-warning mb-3">📊 王表現況</h5>
        <div class="table-responsive">
            <table class="table table-dark table-striped align-middle">
                <thead>
                    <tr>
                        <th>BOSS 名稱</th>
                        <th>間隔</th>
                        <th>預計重生時間</th>
                        <th>剩餘時間</th>
                    </tr>
                </thead>
                <tbody id="bossTableBody">
                    <!-- 資料將由 JS 動態填入與排序 -->
                </tbody>
            </table>
        </div>
        <button class="btn btn-danger mt-3" onclick="resetAll()">全部重置</button>
    </div>

    <script>
        let bossData = {{ bosses | tojson }};

        function updateTable() {
            let tbody = document.getElementById("bossTableBody");
            tbody.innerHTML = "";
            let now = new Date();

            // 將 bossData 轉成陣列以便進行排序
            let bossArray = [];
            for (let bossName in bossData) {
                let info = bossData[bossName];
                let diffSeconds = Infinity; // 預設未登記的排在最後面

                if (info.respawn_time) {
                    let tParts = info.respawn_time.split(/[- :]/);
                    let respawnTime = new Date(tParts[0], tParts[1] - 1, tParts[2], tParts[3], tParts[4], tParts[5]);
                    diffSeconds = Math.floor((respawnTime - now) / 1000);
                }

                bossArray.push({
                    name: bossName,
                    interval: info.interval,
                    respawn_time: info.respawn_time,
                    missed_count: info.missed_count,
                    diffSeconds: diffSeconds
                });
            }

            // 💡 依據剩餘秒數（diffSeconds）由小到大自動排序（最快到期的排在最上面）
            bossArray.sort((a, b) => a.diffSeconds - b.diffSeconds);

            // 渲染排序後的表格
            for (let item of bossArray) {
                let respawnStr = item.respawn_time ? item.respawn_time : "尚未登記";
                let remainingHtml = "-";
                let respawnDisplayHtml = respawnStr;

                if (item.missed_count && item.missed_count > 0) {
                    respawnDisplayHtml = `${respawnStr} <span class="missed-text">過${item.missed_count}</span>`;
                }

                if (item.respawn_time) {
                    let diffSeconds = item.diffSeconds;

                    if (diffSeconds > 0) {
                        let hours = Math.floor(diffSeconds / 3600);
                        let minutes = Math.floor((diffSeconds % 3600) / 60);
                        let seconds = diffSeconds % 60;
                        let timeText = `${hours}時 ${minutes}分 ${seconds}秒`;

                        if (diffSeconds <= 60) {
                            remainingHtml = `<span class="urgent">${timeText} (即將重生!)</span>`;
                        } else {
                            remainingHtml = timeText;
                        }
                    } else {
                        remainingHtml = `<span class="text-muted">更新中...</span>`;
                    }
                }

                let row = `<tr>
                    <td><strong>${item.name}</strong></td>
                    <td>${item.interval}分</td>
                    <td>${respawnDisplayHtml}</td>
                    <td>${remainingHtml}</td>
                </tr>`;
                tbody.innerHTML += row;
            }
        }

        function fetchBosses() {
            fetch('/get_bosses')
                .then(response => response.json())
                .then(data => {
                    bossData = data;
                    updateTable();
                });
        }

        function quickKill(bossName) {
            fetch(`/kill/${encodeURIComponent(bossName)}`, { method: 'POST' })
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        fetchBosses();
                    } else {
                        alert('登記失敗: ' + data.message);
                    }
                });
        }

        function manualKill() {
            let bossName = document.getElementById("manualBoss").value;
            let timeStr = document.getElementById("manualTime").value;

            fetch('/manual_kill', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ boss_name: bossName, time_str: timeStr })
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    document.getElementById("manualTime").value = "";
                    fetchBosses();
                } else {
                    alert('補登失敗: ' + data.message);
                }
            });
        }

        function resetAll() {
            if (confirm("確定要重置所有王的重生時間嗎？")) {
                fetch('/reset', { method: 'POST' })
                    .then(response => response.json())
                    .then(data => {
                        if (data.status === 'success') {
                            fetchBosses();
                        }
                    });
            }
        }

        setInterval(updateTable, 1000);
        setInterval(fetchBosses, 10000);

        updateTable();
    </script>
</body>
</html>
